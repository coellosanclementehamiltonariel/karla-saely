<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Karla Saely & Hamilton Arien 💗</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: black;
        color: #fff;
        overflow-x: hidden;
        text-align: center;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        position: relative;
    }

    h1, p {
        opacity: 0;
        animation: fadeIn 2s forwards;
    }

    h1 { animation-delay: 0.5s; }
    p { animation-delay: 1.5s; }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    .photos {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
    }

    .photos img {
        border-radius: 15px;
        width: 200px;
        height: auto;
        box-shadow: 0 0 20px rgba(255,255,255,0.2);
        transition: transform 0.5s;
    }

    .photos img:hover { transform: scale(1.05); }

    /* Ramo en espacio vacío */
    #ramo {
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translate(-50%, 30%) scale(0.5);
        width: 300px;
        opacity: 0;
        transition: all 2s ease;
        z-index: 2;
    }

    /* Pétalos cayendo */
    .petal {
        position: absolute;
        width: 20px;
        height: 20px;
        background: pink;
        border-radius: 50%;
        animation: fall linear infinite;
        opacity: 0.8;
    }

    @keyframes fall {
        0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    footer {
        margin-top: 60px;
        font-size: 16px;
        opacity: 0.8;
    }

</style>
</head>
<body>

<div class="container">
    <h1>Karla Saely 💗</h1>
    <p>16 meses contigo y aún siento que el destino fue demasiado generoso conmigo.  
    Llegaste para quedarte y enseñarme que el amor verdadero no se promete… se demuestra.</p>

    <div class="photos">
        <img src="imagen1.jpg" alt="Foto 1">
        <img src="imagen2.jpg" alt="Foto 2">
        <img src="imagen3.jpg" alt="Foto 3">
    </div>

    <!-- Ramo -->
    <img id="ramo" src="ramo.png" alt="Ramo de flores">

    <p>¿Seguimos escribiendo nuestra historia?</p>
    <input type="text" id="respuesta" placeholder="Sí">
    <button id="responder">Responder</button>

    <footer>Karla Saely & Hamilton Arien ∞</footer>
</div>

<!-- Música automática usando tu MP3 -->
<audio id="musica" src="musica.mp3" autoplay loop></audio>

<script>
    // Animación ramo y pétalos
    window.onload = function() {
        const ramo = document.getElementById('ramo');
        setTimeout(() => {
            ramo.style.opacity = 1;
            ramo.style.transform = "translate(-50%, 0) scale(1)";
        }, 2000);

        // Crear pétalos
        for(let i=0; i<30; i++){
            let petal = document.createElement('div');
            petal.classList.add('petal');
            petal.style.left = Math.random()*100 + 'vw';
            petal.style.animationDuration = 5 + Math.random()*5 + 's';
            petal.style.animationDelay = Math.random()*5 + 's';
            document.body.appendChild(petal);
        }
    };

    // Respuesta interactiva
    document.getElementById('responder').onclick = function() {
        const resp = document.getElementById('respuesta').value;
        if(resp.toLowerCase() === 'sí' || resp.toLowerCase() === 'si') {
            alert("Entonces caminemos juntos todo lo que la vida nos permita... 💗");
        } else {
            alert("No importa, cada día es una nueva oportunidad de amor 💗");
        }
    }
</script>

</body>
</html>
